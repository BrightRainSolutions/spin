<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Spin</title>
  <meta name="description" content="Field tester for Zephr places grounding tools.">
  <meta name="theme-color" content="#ff4a1c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Spin">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css" rel="stylesheet">
  <link href="/here.css" rel="stylesheet">
  <link href="/style.css" rel="stylesheet">
</head>
<body>
  <div class="app">
    <header class="status" aria-label="Status">
      <span class="logo" aria-hidden="true">SPIN</span>
      <span class="stat" id="stat-acc" title="Location accuracy">± — m</span>
      <span class="stat" id="stat-heading" title="Compass heading">—°</span>
      <span class="badge-sim" id="badge-sim" hidden>SIMULATED</span>
      <span class="spacer"></span>
      <button type="button" class="chip" id="btn-compass" hidden>Enable compass</button>
      <button type="button" class="chip chip-ink" id="btn-log" aria-haspopup="dialog">Log</button>
    </header>

    <main class="map-wrap">
      <div id="map" aria-label="Map"></div>
      <div class="map-note" id="map-note" hidden></div>
      <a class="credit" href="https://zephr.xyz" target="_blank" rel="noopener">Powered by Zephr</a>

      <section class="panel" id="panel" hidden aria-labelledby="panel-title">
        <div class="panel-head">
          <button type="button" class="grab" id="btn-expand" aria-label="Expand panel"></button>
          <h2 id="panel-title">Here</h2>
          <button type="button" class="chip" id="btn-raw" aria-pressed="false">Raw</button>
          <button type="button" class="chip chip-icon" id="btn-close" aria-label="Close panel">✕</button>
        </div>
        <div class="panel-body">
          <div class="view" id="here-view" data-view="here"></div>
          <div class="view" id="go-view" data-view="go" hidden>
            <form id="go-form" class="go-form" autocomplete="off">
              <input id="go-q" type="search" placeholder="coffee, bike shop, ATM" enterkeyhint="search" aria-label="What to find">
              <button type="submit" class="btn-accent">Search</button>
            </form>
            <div class="quick" id="go-quick">
              <button type="button" data-q="coffee">coffee</button>
              <button type="button" data-q="bike shop">bike shop</button>
              <button type="button" data-q="ATM">ATM</button>
              <button type="button" data-q="pharmacy">pharmacy</button>
              <button type="button" data-q="tacos">tacos</button>
            </div>
            <div id="go-body"></div>
          </div>
          <div class="view" id="what-view" data-view="what" hidden></div>
          <div class="view" id="raw-view" hidden></div>
        </div>
      </section>
    </main>

    <nav class="modes" aria-label="Modes">
      <button type="button" class="mode" data-mode="here" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
        Here
      </button>
      <button type="button" class="mode" data-mode="go" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 5.5a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM9.8 8.9 7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3A7.3 7.3 0 0 0 19 13v-2a5 5 0 0 1-4.3-2.4l-1-1.6a2.1 2.1 0 0 0-1.7-1c-.3 0-.5.1-.8.1L6 8.3V13h2V9.6z"/></svg>
        Go
        <span class="nav-dot" id="nav-dot" hidden></span>
      </button>
      <button type="button" class="mode" data-mode="what" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm-5.5-2.5 7.5-3.5 3.5-7.5-7.5 3.5zm5.5-6.6a1.1 1.1 0 1 1 0 2.2 1.1 1.1 0 0 1 0-2.2z"/></svg>
        What's that?
      </button>
    </nav>
  </div>

  <div class="log-screen" id="log-screen" role="dialog" aria-modal="true" aria-labelledby="log-title" hidden>
    <div class="log-head">
      <h2 id="log-title">Call log</h2>
      <span class="spacer"></span>
      <button type="button" class="chip" id="btn-log-copy">Copy all</button>
      <button type="button" class="chip chip-ink" id="btn-log-close">Close</button>
    </div>
    <p class="log-sub" id="log-sub"></p>
    <ol class="log-list" id="log-list"></ol>
    <p class="log-foot">In memory only; cleared on reload. <a href="https://zephr.xyz" target="_blank" rel="noopener">Powered by Zephr</a></p>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js"></script>
  <script src="/here.js"></script>
  <script src="/app.js"></script>
</body>
</html>
